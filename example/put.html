<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>put method</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 2rem; max-width: 720px; }
    pre { background: #f5f5f5; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    .pass { color: #1a7f37; font-weight: bold; }
    .fail { color: #cf222e; font-weight: bold; }
    button { padding: .5rem 1.5rem; font-size: 1rem; cursor: pointer; }
    #status { margin-top: 1rem; }
  </style>
</head>
<body>
  <h2>put 上传验证</h2>
  <p>流程: fetch <code>/api/oss-config</code> → 上传(手动选文件 / 自动生成 2MB)→ 签名 URL 下载 → 逐字节比对。</p>
  <p>配置: <span id="cfg">加载中…</span></p>
  <p>
    <input type="file" id="file" />
    <button id="manual">手动上传指定文件</button>
  </p>
  <p><button id="auto">自动生成文件验证</button></p>
  <pre id="status">待开始</pre>
  <script type="module">
    import { put, signatureUrl, bindOptions } from '/dist/tiny-oss.es.js';
    (function () {
      var statusEl = document.getElementById('status')
      function log (msg) {
        var text = statusEl.textContent
        statusEl.textContent = text === '待开始' ? msg : text + '\n' + msg
      }

      function makeData (size) {
        var bytes = new Uint8Array(size)
        for (var i = 0; i < size; i++) bytes[i] = i % 251
        return bytes
      }

      function toHex (u8) {
        var hex = ''
        for (var i = 0; i < u8.length; i += 65536) {
          var chunk = Array.prototype.slice.call(u8.subarray(i, i + 65536))
          hex += chunk.map(function (b) { return b.toString(16).padStart(2, '0') }).join('')
        }
        return hex
      }

      var upload = null
      var sign = null
      fetch('http://localhost:8080/api/oss-config')
        .then(function (res) { return res.json() })
        .then(function (cfg) {
          var options = {
            accessKeyId: cfg.accessKeyId,
            accessKeySecret: cfg.accessKeySecret,
            region: cfg.region,
            bucket: cfg.bucket
          }
          upload = bindOptions(put, options)
          sign = bindOptions(signatureUrl, options)
          document.getElementById('cfg').textContent = 'bucket=' + cfg.bucket + ' region=' + cfg.region
          log('config ready')
        })
        .catch(function (err) {
          document.getElementById('cfg').textContent = '加载失败'
          log('config error: ' + err.message)
        })

      function verify (objectName, expectedBytes) {
        var url = sign(objectName)
        return fetch(url).then(function (res) { return res.arrayBuffer() }).then(function (buf) {
          var downloaded = new Uint8Array(buf)
          if (downloaded.length !== expectedBytes.length) {
            throw new Error('size mismatch: ' + downloaded.length + ' != ' + expectedBytes.length)
          }
          if (toHex(downloaded) !== toHex(expectedBytes)) {
            throw new Error('content mismatch!')
          }
          return downloaded.length
        })
      }

      function doUpload (objectName, blob, onprogress) {
        return upload(objectName, blob, { onprogress: onprogress })
      }

      document.getElementById('manual').addEventListener('click', function () {
        var fileInput = document.getElementById('file')
        var file = fileInput.files[0]
        if (!file) {
          log('请先选择文件')
          return
        }
        statusEl.className = ''
        statusEl.textContent = '待开始'
        var objectName = file.name
        log('upload: ' + objectName + ' (' + file.size + ' bytes)')
        file.arrayBuffer().then(function (buf) {
          var expected = new Uint8Array(buf)
          return doUpload(objectName, file, function (e) {
            log('progress: ' + Math.round(e.loaded / e.total * 100) + '%')
          }).then(function () {
            log('upload done')
            return verify(objectName, expected)
          }).then(function (len) {
            log('download verified: ' + len + ' bytes, content identical')
            statusEl.className = 'pass'
            statusEl.textContent += '\n✅ PASS: ' + objectName + ' 上传内容逐字节一致'
          })
        })
        .catch(function (err) {
          statusEl.className = 'fail'
          statusEl.textContent += '\n❌ FAIL: ' + (err && err.message ? err.message : err)
        })
      })

      document.getElementById('auto').addEventListener('click', function () {
        statusEl.className = ''
        statusEl.textContent = '待开始'
        var size = 2 * 1024 * 1024
        var bytes = makeData(size)
        var objectName = 'put-auto-' + Date.now()
        var blob = new Blob([bytes], { type: 'application/octet-stream' })
        log('start upload: ' + objectName + ' (' + size + ' bytes)')
        doUpload(objectName, blob, function (e) {
          log('progress: ' + Math.round(e.loaded / e.total * 100) + '%')
        })
          .then(function () {
            log('upload done')
            return verify(objectName, bytes)
          })
          .then(function (len) {
            log('download verified: ' + len + ' bytes, content identical')
            statusEl.className = 'pass'
            statusEl.textContent += '\n✅ PASS: 2MB put 上传内容逐字节一致'
          })
          .catch(function (err) {
            statusEl.className = 'fail'
            statusEl.textContent += '\n❌ FAIL: ' + (err && err.message ? err.message : err)
          })
      })
    })()
  </script>
</body>
</html>
